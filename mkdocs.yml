site_name: Notes
site_url: https://bridgethass.github.io/notes/
repo_url: https://github.com/bridgethass/notes
repo_name: bridgethass/notes
edit_uri: edit/main/notes/

docs_dir: notes

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - exclude-search:
      exclude:
        - log.md
  - roamlinks

nav:
  - Home:
    - index.md
    - Agentic Coding: Agentic_Coding.md
    - Cloud Native: Cloud_Native.md
    - Data: Data.md
    - Geospatial: Geospatial.md
    - Google Earth Engine: Google_Earth_Engine.md
    - Ecology: Ecology.md
    - Remote Sensing: Remote_Sensing.md
    - Training: Training.md
    - Web Design: Web_Design.md
    - Changelog: log.md
